syntax = "proto3";

package access.v1;

option go_package = "github.com/nfc-access/server/api/v1;accessv1";

service CardService {
  rpc RegisterCard(RegisterCardRequest) returns (RegisterCardResponse);
  rpc UnregisterCard(UnregisterCardRequest) returns (UnregisterCardResponse);
  rpc GetCard(GetCardRequest) returns (GetCardResponse);
  rpc ListCards(ListCardsRequest) returns (ListCardsResponse);
  rpc UpdateCard(UpdateCardRequest) returns (UpdateCardResponse);
}

service AccessService {
  rpc VerifyAccess(VerifyAccessRequest) returns (VerifyAccessResponse);
  rpc RemoteOpenDoor(RemoteOpenDoorRequest) returns (RemoteOpenDoorResponse);
  rpc CreatePermissionGroup(CreatePermissionGroupRequest) returns (CreatePermissionGroupResponse);
  rpc ListPermissionGroups(ListPermissionGroupsRequest) returns (ListPermissionGroupsResponse);
  rpc AddTimeRule(AddTimeRuleRequest) returns (AddTimeRuleResponse);
  rpc ListTimeRules(ListTimeRulesRequest) returns (ListTimeRulesResponse);
}

service AuditService {
  rpc GetAccessLogs(GetAccessLogsRequest) returns (GetAccessLogsResponse);
  rpc StreamAccessLogs(StreamAccessLogsRequest) returns (stream AccessLog);
  rpc ReportSuspiciousCard(ReportSuspiciousCardRequest) returns (ReportSuspiciousCardResponse);
}

service BlacklistService {
  rpc AddToBlacklist(AddToBlacklistRequest) returns (AddToBlacklistResponse);
  rpc RemoveFromBlacklist(RemoveFromBlacklistRequest) returns (RemoveFromBlacklistResponse);
  rpc ListBlacklistedCards(ListBlacklistedCardsRequest) returns (ListBlacklistedCardsResponse);
  rpc CheckBlacklist(CheckBlacklistRequest) returns (CheckBlacklistResponse);
  rpc GetSuspiciousCards(GetSuspiciousCardsRequest) returns (GetSuspiciousCardsResponse);
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message Card {
  string id = 1;
  string uid = 2;
  string sak = 3;
  string atqa = 4;
  string card_type = 5;
  string user_id = 6;
  string user_name = 7;
  string permission_group_id = 8;
  string permission_group_name = 9;
  string status = 10;
  string description = 11;
  int64 created_at = 12;
  int64 expires_at = 13;
  bool has_key_a = 14;
  bool has_key_b = 15;
}

message BlacklistedCard {
  string id = 1;
  string uid = 2;
  string card_type = 3;
  string reason = 4;
  string source = 5;
  int64 detected_at = 6;
  int64 expires_at = 7;
  bool is_active = 8;
  string reported_by = 9;
  repeated string evidence = 10;
}

message SuspiciousCard {
  string id = 1;
  string uid = 2;
  string owner_name = 3;
  double anomaly_score = 4;
  repeated string indicators = 5;
  int64 first_detected = 6;
  int64 last_seen = 7;
  int32 violation_count = 8;
  bool is_blacklisted = 9;
}

message RegisterCardRequest {
  string uid = 1;
  string sak = 2;
  string atqa = 3;
  string card_type = 4;
  string user_id = 5;
  string user_name = 6;
  string permission_group_id = 7;
  string description = 8;
  bytes key_a = 9;
  bytes key_b = 10;
  int64 expires_at = 11;
}

message RegisterCardResponse {
  string card_id = 1;
  Card card = 2;
}

message UnregisterCardRequest {
  string card_id = 1;
}

message UnregisterCardResponse {
  bool success = 1;
}

message GetCardRequest {
  string card_id = 1;
}

message GetCardResponse {
  Card card = 1;
}

message ListCardsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  string status = 4;
  string permission_group_id = 5;
}

message ListCardsResponse {
  repeated Card cards = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateCardRequest {
  string card_id = 1;
  string user_name = 2;
  string permission_group_id = 3;
  string status = 4;
  string description = 5;
  int64 expires_at = 6;
}

message UpdateCardResponse {
  Card card = 1;
}

message VerifyAccessRequest {
  string card_uid = 1;
  string door_id = 2;
  int64 timestamp = 3;
  double anomaly_score = 4;
  repeated string indicators = 5;
}

message VerifyAccessResponse {
  bool allowed = 1;
  string reason = 2;
  string access_log_id = 3;
  bool is_suspicious = 4;
  double anomaly_score = 5;
}

message RemoteOpenDoorRequest {
  string door_id = 1;
  string operator_id = 2;
  string reason = 3;
}

message RemoteOpenDoorResponse {
  bool success = 1;
  string access_log_id = 2;
}

message PermissionGroup {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 card_count = 4;
  int64 created_at = 5;
}

message CreatePermissionGroupRequest {
  string name = 1;
  string description = 2;
}

message CreatePermissionGroupResponse {
  PermissionGroup group = 1;
}

message ListPermissionGroupsRequest {
  bool include_cards = 1;
}

message ListPermissionGroupsResponse {
  repeated PermissionGroup groups = 1;
}

message TimeRule {
  string id = 1;
  string permission_group_id = 2;
  int32 day_of_week = 3;
  string start_time = 4;
  string end_time = 5;
  string timezone = 6;
  string description = 7;
}

message AddTimeRuleRequest {
  string permission_group_id = 1;
  int32 day_of_week = 2;
  string start_time = 3;
  string end_time = 4;
  string timezone = 5;
  string description = 6;
}

message AddTimeRuleResponse {
  TimeRule rule = 1;
}

message ListTimeRulesRequest {
  string permission_group_id = 1;
}

message ListTimeRulesResponse {
  repeated TimeRule rules = 1;
}

message AccessLog {
  string id = 1;
  string card_uid = 2;
  string card_id = 3;
  string user_name = 4;
  string door_id = 5;
  string door_name = 6;
  string event_type = 7;
  string result = 8;
  int64 timestamp = 9;
  string details = 10;
  bool is_suspicious = 11;
  double anomaly_score = 12;
}

message GetAccessLogsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string card_uid = 3;
  string door_id = 4;
  string result = 5;
  int64 start_time = 6;
  int64 end_time = 7;
}

message GetAccessLogsResponse {
  repeated AccessLog logs = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message StreamAccessLogsRequest {
  string door_id = 1;
}

message ReportSuspiciousCardRequest {
  string uid = 1;
  double anomaly_score = 2;
  repeated string indicators = 3;
  string reason = 4;
  string reported_by = 5;
}

message ReportSuspiciousCardResponse {
  bool success = 1;
  string suspicious_card_id = 2;
  bool auto_blacklisted = 3;
}

message AddToBlacklistRequest {
  string uid = 1;
  string reason = 2;
  string source = 3;
  string reported_by = 4;
  repeated string evidence = 5;
  int64 expires_at = 6;
}

message AddToBlacklistResponse {
  bool success = 1;
  string blacklist_id = 2;
  string message = 3;
}

message RemoveFromBlacklistRequest {
  string uid = 1;
  string removed_by = 2;
  string reason = 3;
}

message RemoveFromBlacklistResponse {
  bool success = 1;
  string message = 2;
}

message ListBlacklistedCardsRequest {
  int32 page = 1;
  int32 page_size = 2;
  bool active_only = 3;
}

message ListBlacklistedCardsResponse {
  repeated BlacklistedCard cards = 1;
  int32 total = 2;
  int32 page = 3;
}

message CheckBlacklistRequest {
  string uid = 1;
}

message CheckBlacklistResponse {
  bool is_blacklisted = 1;
  BlacklistedCard entry = 2;
}

message GetSuspiciousCardsRequest {
  int32 page = 1;
  int32 page_size = 2;
  double min_score = 3;
  bool include_blacklisted = 4;
}

message GetSuspiciousCardsResponse {
  repeated SuspiciousCard cards = 1;
  int32 total = 2;
  int32 page = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message User {
  string id = 1;
  string username = 2;
  string role = 3;
  string name = 4;
  int64 created_at = 5;
}
