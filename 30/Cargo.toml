[package]
name = "mp4_sei"
version = "0.1.0"
edition = "2021"
description = "MP4 SEI injector - Extract H.264/H.265 bitstreams and inject custom SEI data without re-encoding"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
byteorder = "1.5"
bytes = "1.6"
anyhow = "1.0"
thiserror = "1.0"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
