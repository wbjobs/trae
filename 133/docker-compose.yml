version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    container_name: wruntime-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command:
      - "--http_port"
      - "8222"
      - "--js"
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:latest
    container_name: wruntime-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  nats-data:
  minio-data:
