server.port=8080
spring.application.name=z3950-gateway

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

z3950.timeout-seconds=3
z3950.pool.max-idle=5
z3950.pool.max-active=10
z3950.pool.max-wait=5000

z3950.servers[0].name=library-of-congress
z3950.servers[0].host=z3950.loc.gov
z3950.servers[0].port=7090
z3950.servers[0].database=Voyager
z3950.servers[0].preferredRecordSyntax=USMARC

z3950.servers[1].name=oclc-worldcat
z3950.servers[1].host=z3950.oclc.org
z3950.servers[1].port=210
z3950.servers[1].database=WorldCat
z3950.servers[1].preferredRecordSyntax=USMARC

cache.redis.enabled=true
cache.redis.ttl-seconds=3600
cache.redis.key-prefix=z3950:search:

cache.prefetch.enabled=true
cache.prefetch.cron=0 0 2 * * ?
cache.prefetch.top-n-queries=50
cache.prefetch.min-query-frequency=3
cache.prefetch.analysis-days=7

cache.local.maximum-size=1000
cache.local.expire-after-write-minutes=60
