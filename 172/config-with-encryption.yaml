service:
  name: config-sync-node-1
  http_port: 8080
  data_dir: ./data

nats:
  url: nats://localhost:4222
  kv_bucket: config_sync
  watch_subject: config.*

webhook:
  url: ""
  timeout: 10s
  retry_count: 3
  retry_interval: 5s

encryption:
  enabled: true
  master_key: "dGhpc2lzYTMyYnl0ZWtleWZvcmFlc2djbQ=="
  master_key_file: ""
  encrypt_by_default: true

log:
  level: info
  format: json
