<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D分子模型 - C60富勒烯</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #canvas-container canvas {
            display: block;
        }
        .info-panel {
            position: fixed;
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            font-size: 14px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 100, 255, 0.3);
            min-width: 200px;
            z-index: 1000;
        }
        .info-panel h3 {
            margin-bottom: 12px;
            color: #64b5f6;
            font-size: 16px;
            border-bottom: 1px solid rgba(100, 150, 255, 0.3);
            padding-bottom: 8px;
        }
        .info-panel .info-row {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        .info-panel .label {
            color: #90caf9;
            opacity: 0.8;
        }
        .info-panel .value {
            color: #ffffff;
            font-weight: 500;
        }
        .info-panel .close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .info-panel .close-btn:hover {
            opacity: 1;
        }
        .info-panel .orbit-btn {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .info-panel .orbit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .info-panel .orbit-btn.remove {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        .controls-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            z-index: 100;
            max-width: 280px;
        }
        .controls-panel h2 {
            margin-bottom: 12px;
            color: #64b5f6;
            font-size: 18px;
        }
        .controls-panel p {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .controls-panel .hint {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(100, 150, 255, 0.2);
        }
        .atom-label {
            position: fixed;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
            z-index: 50;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            z-index: 2000;
        }
        .export-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .export-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .export-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .export-btn.recording {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .recording-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            color: white;
        }
        .recording-overlay h3 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.1s linear;
        }
        .progress-text {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="controls-panel">
        <h2>C₆₀ 富勒烯</h2>
        <p><strong>操作说明：</strong></p>
        <p>🖱️ 左键拖拽 - 旋转视角</p>
        <p>🖱️ 右键拖拽 - 平移视角</p>
        <p>🔄 滚轮 - 缩放视图</p>
        <p>👆 点击原子 - 查看详情</p>
        <p class="hint">C60 由60个碳原子组成，呈足球状结构，包含12个五边形和20个六边形。</p>
    </div>

    <button class="export-btn" id="export-btn">🎬 导出视频 (5秒)</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./app.js"></script>
</body>
</html>
