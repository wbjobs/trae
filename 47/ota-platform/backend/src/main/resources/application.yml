spring:
  application:
    name: ota-platform
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:h2:mem:otadb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080

ota:
  security:
    jwt-secret: ota-platform-super-secret-key-for-jwt-token-2024
    jwt-expiration-ms: 86400000
  firmware:
    storage-path: ./firmware-storage
    max-version: 999.999.999
  device:
    heartbeat-timeout-seconds: 120
  encryption:
    aes-key: ota-encryption-key-256bit
  signature:
    rsa-private-key: classpath:keys/private_key.pem
    rsa-public-key: classpath:keys/public_key.pem
