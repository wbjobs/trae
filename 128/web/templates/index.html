<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摔倒检测监控系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 摔倒检测监控系统</h1>
            <div class="connection-status">
                <span id="mqtt-status" class="status-indicator disconnected"></span>
                <span>MQTT: <span id="mqtt-text">未连接</span></span>
            </div>
            <div class="mode-badge" id="mode-badge" style="display:none;">
                多摄像头融合
            </div>
        </header>

        <div class="dashboard">
            <div class="status-panel">
                <div class="status-card normal" id="status-card">
                    <div class="status-icon" id="status-icon">✓</div>
                    <div class="status-text">
                        <h3 id="status-title">系统正常</h3>
                        <p>摔倒概率: <span id="fall-prob">0.00%</span></p>
                        <p>检测状态: <span id="detection-state">NORMAL</span></p>
                        <p id="recovery-info" style="display:none;">恢复进度: <span id="recovery-progress">0</span>/30</p>
                        <p class="last-update">最后更新: <span id="last-update">-</span></p>
                    </div>
                </div>

                <div id="multi-cam-panel" class="multi-cam-panel" style="display:none;">
                    <h3>📹 摄像头状态</h3>
                    <div class="camera-grid" id="camera-grid">
                    </div>
                </div>

                <div id="analysis-3d-panel" class="analysis-3d-panel" style="display:none;">
                    <h3>📊 3D 分析数据</h3>
                    <div class="analysis-grid">
                        <div class="analysis-item">
                            <div class="analysis-label">可见摄像头</div>
                            <div class="analysis-value" id="visible-cameras">0/0</div>
                        </div>
                        <div class="analysis-item">
                            <div class="analysis-label">髋部高度</div>
                            <div class="analysis-value" id="hip-height">0.00 m</div>
                        </div>
                        <div class="analysis-item">
                            <div class="analysis-label">垂直速度</div>
                            <div class="analysis-value" id="vertical-velocity">0.00 m/s</div>
                        </div>
                        <div class="analysis-item">
                            <div class="analysis-label">3D 姿态比</div>
                            <div class="analysis-value" id="body-aspect-ratio">0.00</div>
                        </div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="today-count">0</div>
                        <div class="stat-label">今日报警</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="week-count">0</div>
                        <div class="stat-label">本周报警</div>
                    </div>
                </div>
            </div>

            <div class="charts-panel">
                <div class="chart-card">
                    <h3>近7天报警统计</h3>
                    <canvas id="weeklyChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>今日24小时分布</h3>
                    <canvas id="hourlyChart"></canvas>
                </div>
            </div>

            <div class="alarms-panel">
                <h3>最近报警记录</h3>
                <div class="alarm-list" id="alarm-list">
                    <p class="no-data">暂无报警记录</p>
                </div>
            </div>

            <div class="events-panel">
                <h3>历史事件记录</h3>
                <div class="events-table-container">
                    <table class="events-table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>设备</th>
                                <th>置信度</th>
                                <th>摄像头</th>
                                <th>3D 数据</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="events-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <audio id="alarm-sound" preload="auto">
        <source src="{{ url_for('static', filename='sound/alarm.mp3') }}" type="audio/mpeg">
    </audio>

    <script>
        const USE_MULTI_CAMERA = {{ use_multi_camera | tojson }};
        const NUM_CAMERAS = {{ num_cameras }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
