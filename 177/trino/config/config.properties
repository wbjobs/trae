coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery-server.enabled=true
discovery.uri=http://trino:8080
query.max-memory=4GB
query.max-memory-per-node=2GB
query.min-memory-per-node=1GB
memory.heap-headroom-per-node=512MB
task.concurrency=16
task.max-worker-threads=24
task.writer-count=4
spill-enabled=true
spiller-spill-path=/data/trino/spill
optimizer.iterative-optimizer-enabled=true
optimizer.dictionary-aggregation=true
optimizer.optimize-hash-generation=true
iceberg.dynamic-filtering.enabled=true
iceberg.dynamic-filtering.wait-timeout=30s
