apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chaosexperiments.chaos-injector.io
  labels:
    app.kubernetes.io/managed-by: chaos-injector
spec:
  group: chaos-injector.io
  names:
    kind: ChaosExperiment
    listKind: ChaosExperimentList
    plural: chaosexperiments
    singular: chaosexperiment
    shortNames:
      - ce
      - chaos
    categories:
      - all
      - chaos-engineering
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - faultType
                - targets
                - duration
              properties:
                description:
                  type: string
                  description: "Human-readable description of the experiment"
                faultType:
                  type: string
                  enum:
                    - delay
                    - abort
                    - interrupt
                    - compound
                  description: "Type of fault to inject. Use 'compound' to combine delay+abort in a single rule."
                delay:
                  type: object
                  properties:
                    minMs:
                      type: integer
                      minimum: 50
                      maximum: 2000
                      description: "Minimum delay in milliseconds"
                    maxMs:
                      type: integer
                      minimum: 50
                      maximum: 2000
                      description: "Maximum delay in milliseconds"
                    percent:
                      type: number
                      minimum: 0
                      maximum: 100
                      description: "Percentage of requests affected"
                abort:
                  type: object
                  properties:
                    httpStatus:
                      type: integer
                      minimum: 400
                      maximum: 599
                      description: "HTTP status code to return"
                    percent:
                      type: number
                      minimum: 0
                      maximum: 100
                      description: "Percentage of requests affected"
                interrupt:
                  type: object
                  properties:
                    percent:
                      type: number
                      minimum: 0
                      maximum: 100
                      description: "Percentage of requests affected"
                targets:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - service
                      - namespace
                    properties:
                      service:
                        type: string
                        description: "Target service name"
                      namespace:
                        type: string
                        description: "Target service namespace"
                      version:
                        type: string
                        description: "Target service version"
                      port:
                        type: integer
                        description: "Target service port"
                      subset:
                        type: string
                        description: "Destination rule subset"
                duration:
                  type: string
                  description: "Experiment duration (e.g., 5m, 1h)"
                labels:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                state:
                  type: string
                  enum:
                    - pending
                    - running
                    - paused
                    - completed
                    - failed
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                message:
                  type: string
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.state
        - name: Fault
          type: string
          jsonPath: .spec.faultType
        - name: Duration
          type: string
          jsonPath: .spec.duration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      selectableFields:
        - .spec.faultType
        - .status.state
