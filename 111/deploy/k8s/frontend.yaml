apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-injector-frontend
  namespace: chaos-injector
  labels:
    app: chaos-injector-frontend
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-injector-frontend
  template:
    metadata:
      labels:
        app: chaos-injector-frontend
    spec:
      containers:
        - name: frontend
          image: chaos-injector-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-injector-frontend
  namespace: chaos-injector
  labels:
    app: chaos-injector-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    app: chaos-injector-frontend
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: chaos-injector-frontend
  namespace: chaos-injector
spec:
  hosts:
    - "*"
  gateways:
    - mesh
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: chaos-injector-frontend
            port:
              number: 80
