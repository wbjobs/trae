<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Particle System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading WebGPU Particle System...</p>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>
                Distribution:
                <select id="distribution">
                    <option value="sphere">Sphere</option>
                    <option value="cube">Cube</option>
                    <option value="disk">Disk</option>
                    <option value="galaxy">Galaxy</option>
                </select>
            </label>
        </div>

        <div class="control-group">
            <label>
                Color Theme:
                <select id="colorTheme">
                    <option value="rainbow">Rainbow</option>
                    <option value="fire">Fire</option>
                    <option value="ocean">Ocean</option>
                    <option value="nebula">Nebula</option>
                    <option value="pastel">Pastel</option>
                </select>
            </label>
        </div>

        <div class="control-group">
            <label>
                Particle Count:
                <input type="number" id="count" value="100000" min="1000" max="200000">
            </label>
        </div>

        <button id="regenerate">Regenerate</button>

        <div class="control-group">
            <label>
                Rotation Speed: <span id="rotationValue">2.0</span>
                <input type="range" id="rotationSpeed" min="0" max="10" step="0.1" value="2">
            </label>
        </div>

        <div class="control-group">
            <label>
                Noise Strength: <span id="noiseValue">3.0</span>
                <input type="range" id="noiseStrength" min="0" max="10" step="0.1" value="3">
            </label>
        </div>

        <div class="control-group">
            <label>
                Gravity: <span id="gravityValue">5.0</span>
                <input type="range" id="gravityStrength" min="0" max="20" step="0.5" value="5">
            </label>
        </div>

        <div class="control-group">
            <label>
                Collision: <span id="collisionValue">2.0</span>
                <input type="range" id="collisionStrength" min="0" max="10" step="0.1" value="2">
            </label>
        </div>

        <div class="control-group">
            <label>
                Particle Radius: <span id="radiusValue">0.15</span>
                <input type="range" id="particleRadius" min="0.05" max="0.5" step="0.01" value="0.15">
            </label>
        </div>

        <div class="info">
            <p>🖱️ Drag to rotate | Scroll to zoom</p>
        </div>
    </div>

    <script type="module" src="dist/main.js"></script>
    <script>
        document.getElementById('rotationSpeed').addEventListener('input', (e) => {
            document.getElementById('rotationValue').textContent = e.target.value;
        });
        document.getElementById('noiseStrength').addEventListener('input', (e) => {
            document.getElementById('noiseValue').textContent = e.target.value;
        });
        document.getElementById('gravityStrength').addEventListener('input', (e) => {
            document.getElementById('gravityValue').textContent = e.target.value;
        });
        document.getElementById('collisionStrength').addEventListener('input', (e) => {
            document.getElementById('collisionValue').textContent = e.target.value;
        });
        document.getElementById('particleRadius').addEventListener('input', (e) => {
            document.getElementById('radiusValue').textContent = e.target.value;
        });
    </script>
</body>
</html>
