<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>矩阵乘法性能对比 - WASM vs JavaScript</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="matmul_js.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .control-row {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        select, input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .result-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .result-card:hover {
            transform: translateY(-5px);
        }

        .result-card.wasm {
            border-top: 4px solid #4caf50;
        }

        .result-card.js {
            border-top: 4px solid #2196f3;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .result-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .wasm .result-icon {
            background: #e8f5e9;
        }

        .js .result-icon {
            background: #e3f2fd;
        }

        .result-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
        }

        .metric {
            margin-bottom: 12px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .metric-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
        }

        .metric-unit {
            font-size: 0.8em;
            color: #999;
            font-weight: 400;
        }

        .comparison {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .comparison h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .speedup {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .speedup-value {
            font-size: 3em;
            font-weight: 700;
        }

        .speedup-label {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chart-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        .history-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .history-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .history-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .history-controls button {
            flex: 1;
            min-width: 150px;
        }

        .hidden {
            display: none !important;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ 矩阵乘法性能对比</h1>
        <p class="subtitle">WebAssembly (C++) vs JavaScript - 1024x1024 矩阵乘法</p>

        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="matrixSize">矩阵大小</label>
                    <select id="matrixSize">
                        <option value="256">256 x 256</option>
                        <option value="512">512 x 512</option>
                        <option value="1024" selected>1024 x 1024</option>
                        <option value="2048">2048 x 2048</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="iterations">测试次数</label>
                    <select id="iterations">
                        <option value="1">1 次</option>
                        <option value="3" selected>3 次</option>
                        <option value="5">5 次</option>
                        <option value="10">10 次</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="algorithm">算法类型</label>
                    <select id="algorithm">
                        <option value="auto" selected>🤖 自动调优</option>
                        <option value="optimized">普通优化 (ikj)</option>
                        <option value="normal">普通版本 (ijk)</option>
                        <option value="tiled_8">分块 (8x8)</option>
                        <option value="tiled_16">分块 (16x16)</option>
                        <option value="tiled_32">分块 (32x32)</option>
                        <option value="tiled_64">分块 (64x64)</option>
                    </select>
                </div>
                <div class="control-group" style="align-self: flex-end;">
                    <button id="autoTuneBtn" onclick="runAutoTune()" style="background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);">🔍 自动调优</button>
                </div>
                <div class="control-group" style="align-self: flex-end;">
                    <button id="runBtn" onclick="runBenchmark()">🚀 开始测试</button>
                </div>
            </div>
            <div id="autoTuneInfo" class="hidden" style="margin-top: 15px; padding: 10px; background: #fff3e0; border-radius: 8px; text-align: center;">
                <span id="autoTuneStatus">正在自动调优...</span>
                <div class="progress-bar" style="margin-top: 10px;">
                    <div id="autoTuneProgress" class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div id="status" class="status info hidden"></div>

        <div id="resultsSection" class="hidden">
            <div class="results-grid">
                <div class="result-card wasm">
                    <div class="result-header">
                        <div class="result-icon">⚙️</div>
                        <div class="result-title">WebAssembly (C++)</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">平均耗时</div>
                        <div class="metric-value"><span id="wasmTime">--</span> <span class="metric-unit">毫秒</span></div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">FLOPS</div>
                        <div class="metric-value"><span id="wasmFlops">--</span> <span class="metric-unit">GFLOPS</span></div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">最快单次</div>
                        <div class="metric-value"><span id="wasmMin">--</span> <span class="metric-unit">毫秒</span></div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">最慢单次</div>
                        <div class="metric-value"><span id="wasmMax">--</span> <span class="metric-unit">毫秒</span></div>
                    </div>
                </div>

                <div class="result-card js">
                    <div class="result-header">
                        <div class="result-icon">🟨</div>
                        <div class="result-title">JavaScript</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">平均耗时</div>
                        <div class="metric-value"><span id="jsTime">--</span> <span class="metric-unit">毫秒</span></div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">FLOPS</div>
                        <div class="metric-value"><span id="jsFlops">--</span> <span class="metric-unit">GFLOPS</span></div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">最快单次</div>
                        <div class="metric-value"><span id="jsMin">--</span> <span class="metric-unit">毫秒</span></div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">最慢单次</div>
                        <div class="metric-value"><span id="jsMax">--</span> <span class="metric-unit">毫秒</span></div>
                    </div>
                </div>
            </div>

            <div class="comparison">
                <h2>📊 性能对比</h2>
                <div class="speedup">
                    <div class="speedup-value" id="speedupValue">--</div>
                    <div class="speedup-label">WASM 相比 JS 的加速倍数</div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="comparisonChart"></canvas>
                </div>
            </div>
        </div>

        <div class="history-section">
            <h2>📈 历史记录对比</h2>
            <div class="history-controls">
                <button onclick="loadHistory()">📥 加载历史记录</button>
                <button onclick="clearHistory()">🗑️ 清空历史记录</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
