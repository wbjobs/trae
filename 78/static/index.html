<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模态搜索系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 15px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: #f3f4f6;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            color: #4b5563;
        }

        .tab-btn:hover {
            background: #e5e7eb;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-upload {
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        .file-upload:hover,
        .file-upload.dragover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-upload p {
            color: #6b7280;
            margin-top: 10px;
        }

        .file-upload-icon {
            font-size: 3rem;
            color: #9ca3af;
        }

        .image-preview {
            margin-top: 15px;
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }

        .results-header h2 {
            color: #1f2937;
        }

        .results-stats {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: #f9fafb;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #e5e7eb;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .result-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        .result-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-content {
            padding: 15px;
        }

        .result-text {
            color: #374151;
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .result-scores {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .feedback-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
        }

        .feedback-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .feedback-btn:hover {
            background: #f3f4f6;
        }

        .feedback-btn.active.like {
            background: #dcfce7;
            border-color: #22c55e;
            color: #16a34a;
        }

        .feedback-btn.active.dislike {
            background: #fee2e2;
            border-color: #ef4444;
            color: #dc2626;
        }

        .feedback-message {
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .feedback-message.success {
            background: #dcfce7;
            color: #16a34a;
            display: block;
        }

        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .sub-tab-btn {
            padding: 8px 16px;
            border: none;
            background: #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .sub-tab-btn.active {
            background: #667eea;
            color: white;
        }

        .sub-tab-content {
            display: none;
        }

        .sub-tab-content.active {
            display: block;
        }

        .model-version-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
        }

        .model-version-card.deployed {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .model-version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .model-version-name {
            font-weight: 600;
            color: #1f2937;
        }

        .model-version-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-deployed {
            background: #dcfce7;
            color: #16a34a;
        }

        .status-training {
            background: #fef3c7;
            color: #d97706;
        }

        .status-archived {
            background: #e5e7eb;
            color: #6b7280;
        }

        .training-status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .experiment-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
        }

        .experiment-card.running {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .variant-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .variant-row:last-child {
            border-bottom: none;
        }

        .score-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .score-vector {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .score-cross {
            background: #dcfce7;
            color: #15803d;
        }

        .score-hybrid {
            background: #fef3c7;
            color: #b45309;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert-info {
            background: #dbeafe;
            color: #1d4ed8;
            border: 1px solid #93c5fd;
        }

        .actions-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .main-card,
            .results-section {
                padding: 20px;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 多模态搜索系统</h1>
            <p>基于 CLIP + ChromaDB + Cross-Encoder 的图文混合搜索</p>
        </header>

        <div class="main-card">
            <div class="stats-bar" id="statsBar">
                <div class="stat-card">
                    <div class="stat-value" id="totalItems">0</div>
                    <div class="stat-label">索引项目</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="embeddingDim">-</div>
                    <div class="stat-label">嵌入维度</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="search">搜索</button>
                <button class="tab-btn" data-tab="upload">上传索引</button>
                <button class="tab-btn" data-tab="manage">管理</button>
            </div>

            <div class="tab-content active" id="tab-search">
                <div class="alert" id="searchAlert"></div>
                
                <div class="form-group">
                    <label>文本描述</label>
                    <textarea 
                        id="searchText" 
                        placeholder="输入搜索描述，例如：蓝色的汽车，类似这样的图片..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label>上传图片（可选，用于图文混合搜索）</label>
                    <div class="file-upload" id="searchDropZone">
                        <input type="file" id="searchImage" accept="image/*" style="display: none;">
                        <div class="file-upload-icon">📁</div>
                        <p>点击或拖拽图片到此处上传<br>支持 JPG, PNG, GIF, WebP</p>
                        <div class="image-preview" id="searchImagePreview">
                            <img id="searchPreviewImg" src="" alt="预览">
                        </div>
                    </div>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="useRerank" checked>
                        <span>使用 Cross-Encoder 重排序</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="hybridSearch" checked>
                        <span>混合排序（向量 + Cross-Encoder）</span>
                    </label>
                </div>

                <div class="actions-row">
                    <button class="btn btn-primary" id="searchBtn" onclick="performSearch()">
                        🔍 搜索
                    </button>
                    <button class="btn btn-secondary" onclick="clearSearch()">
                        清空
                    </button>
                </div>
            </div>

            <div class="tab-content" id="tab-upload">
                <div class="alert" id="uploadAlert"></div>
                
                <div class="form-group">
                    <label>上传图片</label>
                    <div class="file-upload" id="uploadDropZone">
                        <input type="file" id="uploadImage" accept="image/*" style="display: none;">
                        <div class="file-upload-icon">📤</div>
                        <p>点击或拖拽图片到此处上传<br>支持 JPG, PNG, GIF, WebP</p>
                        <div class="image-preview" id="uploadImagePreview">
                            <img id="uploadPreviewImg" src="" alt="预览">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>文本描述（可选）</label>
                    <textarea 
                        id="uploadText" 
                        placeholder="为图片添加描述文本，帮助更好地索引..."
                    ></textarea>
                </div>

                <div class="actions-row">
                    <button class="btn btn-primary" id="uploadBtn" onclick="uploadAndIndex()">
                        ⬆️ 上传并索引
                    </button>
                    <button class="btn btn-secondary" onclick="clearUpload()">
                        清空
                    </button>
                </div>
            </div>

            <div class="tab-content" id="tab-manage">
                <div class="alert" id="manageAlert"></div>
                
                <div class="sub-tabs">
                    <button class="sub-tab-btn active" data-subtab="items">📋 项目管理</button>
                    <button class="sub-tab-btn" data-subtab="feedback">📊 反馈数据</button>
                    <button class="sub-tab-btn" data-subtab="models">🔧 模型版本</button>
                    <button class="sub-tab-btn" data-subtab="training">⚙️ 训练调度</button>
                    <button class="sub-tab-btn" data-subtab="abtest">🧪 A/B测试</button>
                </div>

                <div class="sub-tab-content active" id="subtab-items">
                    <p style="color: #4b5563; margin-bottom: 20px;">
                        管理已索引的项目。您可以查看所有项目或清空索引。
                    </p>
                    <div class="actions-row">
                        <button class="btn btn-secondary" onclick="loadAllItems()">
                            📋 查看所有项目
                        </button>
                        <button class="btn btn-danger" onclick="clearAllIndex()">
                            🗑️ 清空所有索引
                        </button>
                    </div>
                </div>

                <div class="sub-tab-content" id="subtab-feedback">
                    <div id="feedbackStats"></div>
                    <div id="feedbackList"></div>
                </div>

                <div class="sub-tab-content" id="subtab-models">
                    <div id="modelVersions"></div>
                </div>

                <div class="sub-tab-content" id="subtab-training">
                    <div id="trainingStatus"></div>
                </div>

                <div class="sub-tab-content" id="subtab-abtest">
                    <div id="abExperiments"></div>
                </div>
            </div>
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2 id="resultsTitle">搜索结果</h2>
                <div class="results-stats" id="resultsStats"></div>
            </div>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        let selectedSearchFile = null;
        let selectedUploadFile = null;

        let currentQueryId = null;
        let currentSearchText = null;
        const feedbackStates = {};

        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            setupTabs();
            setupSubTabs();
            setupFileUploads();
            
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.tab === 'manage') {
                        loadFeedbackStats();
                        loadModelVersions();
                        loadTrainingStatus();
                        loadABExperiments();
                    }
                });
            });
        });

        function setupTabs() {
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
                });
            });
        }

        function setupSubTabs() {
            const subTabBtns = document.querySelectorAll('.sub-tab-btn');
            subTabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const subtab = btn.dataset.subtab;
                    subTabBtns.forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.sub-tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`subtab-${subtab}`).classList.add('active');
                    
                    if (subtab === 'feedback') loadFeedbackStats();
                    if (subtab === 'models') loadModelVersions();
                    if (subtab === 'training') loadTrainingStatus();
                    if (subtab === 'abtest') loadABExperiments();
                });
            });
        }

        function setupFileUploads() {
            setupDropZone('search');
            setupDropZone('upload');
        }

        function setupDropZone(prefix) {
            const dropZone = document.getElementById(`${prefix}DropZone`);
            const fileInput = document.getElementById(`${prefix}Image`);
            const preview = document.getElementById(`${prefix}ImagePreview`);
            const previewImg = document.getElementById(`${prefix}PreviewImg`);

            dropZone.addEventListener('click', () => fileInput.click());

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileSelect(files[0], prefix);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFileSelect(e.target.files[0], prefix);
                }
            });

            function handleFileSelect(file, prefix) {
                if (!file.type.startsWith('image/')) {
                    showAlert(`${prefix}Alert`, '请选择图片文件', 'error');
                    return;
                }

                if (prefix === 'search') {
                    selectedSearchFile = file;
                } else {
                    selectedUploadFile = file;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                document.getElementById('totalItems').textContent = data.total_items;
                document.getElementById('embeddingDim').textContent = data.embedding_dim;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function performSearch() {
            const text = document.getElementById('searchText').value.trim();
            const useRerank = document.getElementById('useRerank').checked;
            const hybridSearch = document.getElementById('hybridSearch').checked;

            if (!text && !selectedSearchFile) {
                showAlert('searchAlert', '请输入搜索文本或上传图片', 'error');
                return;
            }

            currentQueryId = 'query_' + Date.now();
            currentSearchText = text;

            const formData = new FormData();
            if (text) formData.append('text', text);
            if (selectedSearchFile) formData.append('file', selectedSearchFile);
            formData.append('top_k', 10);
            formData.append('use_rerank', useRerank);
            formData.append('hybrid_search', hybridSearch);

            showLoading();
            hideAlert('searchAlert');

            try {
                const response = await fetch(`${API_BASE}/api/upload-and-search`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    displayResults(data.results, data.query_time_ms);
                } else {
                    showAlert('searchAlert', data.detail || '搜索失败', 'error');
                }
            } catch (error) {
                showAlert('searchAlert', '网络错误，请检查后端服务是否启动', 'error');
                console.error('Search error:', error);
            } finally {
                hideLoading();
            }
        }

        async function uploadAndIndex() {
            const text = document.getElementById('uploadText').value.trim();

            if (!selectedUploadFile) {
                showAlert('uploadAlert', '请选择要上传的图片', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedUploadFile);
            if (text) formData.append('text', text);

            showLoading();
            hideAlert('uploadAlert');

            try {
                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('uploadAlert', data.message, 'success');
                    clearUpload();
                    loadStats();
                } else {
                    showAlert('uploadAlert', data.detail || '上传失败', 'error');
                }
            } catch (error) {
                showAlert('uploadAlert', '网络错误，请检查后端服务是否启动', 'error');
                console.error('Upload error:', error);
            } finally {
                hideLoading();
            }
        }

        async function loadAllItems() {
            showLoading();
            hideAlert('manageAlert');

            try {
                const response = await fetch(`${API_BASE}/api/items?limit=100`);
                const data = await response.json();

                if (response.ok) {
                    displayItems(data.items);
                } else {
                    showAlert('manageAlert', data.detail || '加载失败', 'error');
                }
            } catch (error) {
                showAlert('manageAlert', '网络错误，请检查后端服务是否启动', 'error');
                console.error('Load items error:', error);
            } finally {
                hideLoading();
            }
        }

        async function clearAllIndex() {
            if (!confirm('确定要清空所有索引吗？此操作不可恢复！')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/items`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('manageAlert', data.message, 'success');
                    loadStats();
                    document.getElementById('resultsSection').style.display = 'none';
                } else {
                    showAlert('manageAlert', data.detail || '删除失败', 'error');
                }
            } catch (error) {
                showAlert('manageAlert', '网络错误，请检查后端服务是否启动', 'error');
                console.error('Clear index error:', error);
            }
        }

        async function deleteItem(id) {
            if (!confirm('确定要删除此项目吗？')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/items/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadAllItems();
                    loadStats();
                } else {
                    const data = await response.json();
                    alert(data.detail || '删除失败');
                }
            } catch (error) {
                alert('网络错误');
                console.error('Delete item error:', error);
            }
        }

        function displayResults(results, queryTime) {
            const section = document.getElementById('resultsSection');
            const content = document.getElementById('resultsContent');
            const stats = document.getElementById('resultsStats');

            document.getElementById('resultsTitle').textContent = '搜索结果';
            stats.textContent = `找到 ${results.length} 个结果，耗时 ${queryTime.toFixed(1)}ms`;

            if (results.length === 0) {
                content.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <p>没有找到相关结果</p>
                        <p style="margin-top: 10px; font-size: 0.9rem;">尝试使用不同的关键词或上传更多图片</p>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="results-grid">${results.map(renderResultCard).join('')}</div>`;
            }

            section.style.display = 'block';
        }

        function displayItems(items) {
            const section = document.getElementById('resultsSection');
            const content = document.getElementById('resultsContent');
            const stats = document.getElementById('resultsStats');

            document.getElementById('resultsTitle').textContent = '所有项目';
            stats.textContent = `共 ${items.length} 个项目`;

            if (items.length === 0) {
                content.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">📭</div>
                        <p>暂无索引项目</p>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="results-grid">${items.map(renderItemCard).join('')}</div>`;
            }

            section.style.display = 'block';
        }

        function renderResultCard(item) {
            const hasImage = item.image_url;
            const text = item.text || '无文本描述';
            const feedbackState = feedbackStates[item.id] || 'none';
            
            let scores = '';
            if (item.hybrid_score !== undefined && item.hybrid_score !== null) {
                scores += `<span class="score-badge score-hybrid">混合: ${item.hybrid_score.toFixed(3)}</span>`;
            }
            if (item.cross_encoder_score !== undefined && item.cross_encoder_score !== null) {
                scores += `<span class="score-badge score-cross">Cross: ${item.cross_encoder_score.toFixed(3)}</span>`;
            }
            scores += `<span class="score-badge score-vector">向量: ${(1 - item.score).toFixed(3)}</span>`;

            return `
                <div class="result-card" id="result-${item.id}">
                    <div class="result-image">
                        ${hasImage ? `<img src="${API_BASE}${item.image_url}" alt="结果图片">` : '📄'}
                    </div>
                    <div class="result-content">
                        <div class="result-text">${escapeHtml(text)}</div>
                        <div class="result-scores">${scores}</div>
                        <div class="feedback-buttons">
                            <button class="feedback-btn ${feedbackState === 'like' ? 'active like' : ''}" 
                                    onclick="submitFeedback('${item.id}', 'like')" 
                                    title="相关/有用">
                                👍
                            </button>
                            <button class="feedback-btn ${feedbackState === 'dislike' ? 'active dislike' : ''}" 
                                    onclick="submitFeedback('${item.id}', 'dislike')" 
                                    title="不相关/没用">
                                👎
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderItemCard(item) {
            const hasImage = item.image_url;
            const text = item.text || '无文本描述';

            return `
                <div class="result-card">
                    <div class="result-image">
                        ${hasImage ? `<img src="${API_BASE}${item.image_url}" alt="结果图片">` : '📄'}
                    </div>
                    <div class="result-content">
                        <div class="result-text">${escapeHtml(text)}</div>
                        <div class="actions-row">
                            <button class="btn btn-danger" style="padding: 8px 16px; font-size: 0.85rem;" onclick="deleteItem('${item.id}')">
                                🗑️ 删除
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function clearSearch() {
            document.getElementById('searchText').value = '';
            document.getElementById('searchImage').value = '';
            document.getElementById('searchImagePreview').style.display = 'none';
            selectedSearchFile = null;
            hideAlert('searchAlert');
        }

        function clearUpload() {
            document.getElementById('uploadText').value = '';
            document.getElementById('uploadImage').value = '';
            document.getElementById('uploadImagePreview').style.display = 'none';
            selectedUploadFile = null;
        }

        function showAlert(id, message, type) {
            const alert = document.getElementById(id);
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
        }

        function hideAlert(id) {
            document.getElementById(id).style.display = 'none';
        }

        function showLoading() {
            const content = document.getElementById('resultsContent');
            document.getElementById('resultsSection').style.display = 'block';
            content.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>处理中...</span>
                </div>
            `;
        }

        function hideLoading() {
        }

        function submitFeedback(resultId, feedbackType) {
            if (!currentQueryId) {
                currentQueryId = 'query_' + Date.now();
            }

            feedbackStates[resultId] = feedbackType;
            
            const resultCard = document.getElementById(`result-${resultId}`);
            if (resultCard) {
                const buttons = resultCard.querySelectorAll('.feedback-btn');
                buttons.forEach(btn => {
                    btn.classList.remove('active', 'like', 'dislike');
                });
                event.target.classList.add('active', feedbackType);
            }

            fetch(`${API_BASE}/api/feedback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query_id: currentQueryId,
                    result_id: resultId,
                    feedback_type: feedbackType,
                    query_text: currentSearchText
                })
            }).then(response => response.json())
              .then(data => {
                  if (data.success) {
                      console.log('Feedback submitted:', data.feedback_id);
                  }
              })
              .catch(error => console.error('Feedback error:', error));
        }

        async function loadFeedbackStats() {
            try {
                const response = await fetch(`${API_BASE}/api/feedback/stats`);
                const stats = await response.json();
                
                document.getElementById('feedbackStats').innerHTML = `
                    <div class="stats-bar">
                        <div class="stat-card">
                            <div class="stat-value">${stats.total_feedbacks}</div>
                            <div class="stat-label">总反馈数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.likes}</div>
                            <div class="stat-label">👍 点赞</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.dislikes}</div>
                            <div class="stat-label">👎 点踩</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.last_7_days}</div>
                            <div class="stat-label">近7天</div>
                        </div>
                    </div>
                    <p style="margin-top: 15px; color: #4b5563;">
                        待训练样本数: <strong>${stats.pending_training_samples}</strong>
                        ${stats.pending_training_samples >= 10 ? '<span style="color: #22c55e;">✓ 满足训练条件</span>' : '<span style="color: #f59e0b;">⚠️ 需要至少10个样本</span>'}
                    </p>
                `;
            } catch (error) {
                console.error('Load feedback stats error:', error);
            }
        }

        async function loadModelVersions() {
            try {
                const response = await fetch(`${API_BASE}/api/models/versions`);
                const data = await response.json();
                
                let html = '<h3 style="margin-bottom: 15px;">模型版本</h3>';
                
                if (data.versions.length === 0) {
                    html += '<p style="color: #6b7280;">暂无模型版本</p>';
                } else {
                    data.versions.forEach(version => {
                        const isDeployed = version.status === 'deployed';
                        html += `
                            <div class="model-version-card ${isDeployed ? 'deployed' : ''}">
                                <div class="model-version-header">
                                    <span class="model-version-name">${version.version}</span>
                                    <span class="model-version-status status-${version.status}">${version.status}</span>
                                </div>
                                <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 8px;">
                                    ${version.description || '无描述'}
                                </p>
                                <p style="font-size: 0.85rem; color: #9ca3af;">
                                    创建时间: ${new Date(version.created_at).toLocaleString()}
                                    ${version.trained_at ? ' | 训练时间: ' + new Date(version.trained_at).toLocaleString() : ''}
                                </p>
                                ${version.metrics ? `
                                    <div style="margin-top: 8px; font-size: 0.85rem;">
                                        <strong>指标:</strong> 
                                        验证准确率: ${(version.metrics.final_val_accuracy * 100).toFixed(2)}% | 
                                        训练样本: ${version.training_samples}
                                    </div>
                                ` : ''}
                                ${!isDeployed && version.status === 'archived' ? `
                                    <button class="btn btn-secondary" style="margin-top: 10px; padding: 6px 12px; font-size: 0.85rem;" 
                                            onclick="deployModelVersion('${version.version}')">
                                        部署此版本
                                    </button>
                                ` : ''}
                            </div>
                        `;
                    });
                }
                
                html += `
                    <div class="actions-row" style="margin-top: 20px;">
                        <button class="btn btn-primary" onclick="rollbackModel()">
                            ↩️ 回滚到上一版本
                        </button>
                    </div>
                `;
                
                document.getElementById('modelVersions').innerHTML = html;
            } catch (error) {
                console.error('Load model versions error:', error);
            }
        }

        async function deployModelVersion(version) {
            if (!confirm(`确定要部署版本 ${version} 吗？`)) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/models/${version}/deploy`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    alert('部署成功！');
                    loadModelVersions();
                } else {
                    alert('部署失败: ' + (data.detail || '未知错误'));
                }
            } catch (error) {
                alert('部署失败: ' + error.message);
            }
        }

        async function rollbackModel() {
            if (!confirm('确定要回滚到上一个版本吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/models/rollback`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    alert(`回滚成功！当前版本: ${data.version}`);
                    loadModelVersions();
                } else {
                    alert('回滚失败: ' + (data.detail || '未知错误'));
                }
            } catch (error) {
                alert('回滚失败: ' + error.message);
            }
        }

        async function loadTrainingStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/training/status`);
                const status = await response.json();
                
                let html = `
                    <div class="training-status-card">
                        <h3 style="margin-bottom: 15px;">训练调度状态</h3>
                        <p><strong>自动训练:</strong> ${status.auto_training_enabled ? '✅ 已启用' : '❌ 已禁用'}</p>
                        <p><strong>训练间隔:</strong> ${status.training_interval_days} 天</p>
                        <p><strong>当前状态:</strong> ${status.is_running ? '🏃 训练中...' : '⏸️ 空闲'}</p>
                        ${status.next_run_time ? `<p><strong>下次运行:</strong> ${new Date(status.next_run_time).toLocaleString()}</p>` : ''}
                        ${status.last_run_time ? `<p><strong>上次运行:</strong> ${new Date(status.last_run_time).toLocaleString()} (${status.last_run_result || '无结果'})</p>` : ''}
                    </div>
                `;
                
                html += `
                    <div class="actions-row" style="margin-bottom: 20px;">
                        <button class="btn btn-primary" onclick="startTraining()">
                            🚀 立即训练
                        </button>
                        ${!status.auto_training_enabled ? `
                            <button class="btn btn-secondary" onclick="enableAutoTraining()">
                                ⏰ 启用自动训练
                            </button>
                        ` : `
                            <button class="btn btn-secondary" onclick="disableAutoTraining()">
                                ⏹️ 禁用自动训练
                            </button>
                        `}
                    </div>
                `;
                
                const runsResponse = await fetch(`${API_BASE}/api/training/runs`);
                const runsData = await runsResponse.json();
                
                html += '<h3 style="margin-bottom: 15px;">最近训练记录</h3>';
                if (runsData.runs.length === 0) {
                    html += '<p style="color: #6b7280;">暂无训练记录</p>';
                } else {
                    runsData.runs.forEach(run => {
                        html += `
                            <div class="model-version-card">
                                <div class="model-version-header">
                                    <span class="model-version-name">${run.model_version}</span>
                                    <span class="model-version-status status-${run.status}">${run.status}</span>
                                </div>
                                <p style="font-size: 0.85rem; color: #6b7280;">
                                    开始: ${new Date(run.started_at).toLocaleString()}
                                    ${run.ended_at ? ' | 结束: ' + new Date(run.ended_at).toLocaleString() : ''}
                                </p>
                                <p style="font-size: 0.85rem; color: #6b7280;">
                                    反馈样本: ${run.feedback_count}
                                    ${run.error_message ? ' | 错误: ' + run.error_message : ''}
                                </p>
                            </div>
                        `;
                    });
                }
                
                document.getElementById('trainingStatus').innerHTML = html;
            } catch (error) {
                console.error('Load training status error:', error);
            }
        }

        async function startTraining() {
            if (!confirm('确定要开始训练吗？这可能需要一些时间。')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/training/start`, { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                setTimeout(loadTrainingStatus, 2000);
            } catch (error) {
                alert('启动训练失败: ' + error.message);
            }
        }

        async function enableAutoTraining() {
            const days = prompt('训练间隔（天）:', '7');
            if (days === null) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/training/auto/enable?interval_days=${days}`, { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                loadTrainingStatus();
            } catch (error) {
                alert('启用失败: ' + error.message);
            }
        }

        async function disableAutoTraining() {
            if (!confirm('确定要禁用自动训练吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/training/auto/disable`, { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                loadTrainingStatus();
            } catch (error) {
                alert('禁用失败: ' + error.message);
            }
        }

        async function loadABExperiments() {
            try {
                const response = await fetch(`${API_BASE}/api/ab/experiments`);
                const data = await response.json();
                
                let html = '<h3 style="margin-bottom: 15px;">A/B测试实验</h3>';
                
                html += `
                    <div class="actions-row" style="margin-bottom: 20px;">
                        <button class="btn btn-primary" onclick="createABExperiment()">
                            ➕ 创建新实验
                        </button>
                    </div>
                `;
                
                if (data.experiments.length === 0) {
                    html += '<p style="color: #6b7280;">暂无实验</p>';
                } else {
                    data.experiments.forEach(exp => {
                        const isRunning = exp.status === 'running';
                        html += `
                            <div class="experiment-card ${isRunning ? 'running' : ''}">
                                <div class="model-version-header">
                                    <span class="model-version-name">${exp.name}</span>
                                    <span class="model-version-status status-${exp.status}">${exp.status}</span>
                                </div>
                                ${exp.description ? `<p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 8px;">${exp.description}</p>` : ''}
                                <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 10px;">
                                    创建时间: ${new Date(exp.created_at).toLocaleString()}
                                    ${exp.started_at ? ' | 开始: ' + new Date(exp.started_at).toLocaleString() : ''}
                                </p>
                                <h4 style="margin-bottom: 8px; font-size: 0.95rem;">变体:</h4>
                                ${exp.variants.map(v => `
                                    <div class="variant-row">
                                        <span>${v.name} (${v.traffic_percentage}%) - 版本: ${v.model_version}</span>
                                    </div>
                                `).join('')}
                                <div class="actions-row" style="margin-top: 15px;">
                                    ${exp.status === 'draft' ? `
                                        <button class="btn btn-primary" onclick="startABExperiment('${exp.id}')">▶️ 启动</button>
                                    ` : ''}
                                    ${exp.status === 'running' ? `
                                        <button class="btn btn-secondary" onclick="pauseABExperiment('${exp.id}')">⏸️ 暂停</button>
                                        <button class="btn btn-secondary" onclick="endABExperiment('${exp.id}')">⏹️ 结束</button>
                                        <button class="btn btn-primary" onclick="deployABWinner('${exp.id}')">🏆 部署获胜者</button>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });
                }
                
                document.getElementById('abExperiments').innerHTML = html;
            } catch (error) {
                console.error('Load AB experiments error:', error);
            }
        }

        async function createABExperiment() {
            const name = prompt('实验名称:');
            if (!name) return;
            
            const description = prompt('实验描述（可选）:');
            const baseVersion = prompt('基线模型版本:', 'base');
            const testVersion = prompt('测试模型版本:');
            if (!testVersion) return;
            
            const variants = [
                { name: '对照组', model_version: baseVersion, traffic_percentage: 50 },
                { name: '测试组', model_version: testVersion, traffic_percentage: 50 }
            ];
            
            try {
                const response = await fetch(`${API_BASE}/api/ab/experiments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, variants })
                });
                const data = await response.json();
                if (data.success) {
                    alert('实验创建成功！');
                    loadABExperiments();
                } else {
                    alert('创建失败: ' + (data.detail || '未知错误'));
                }
            } catch (error) {
                alert('创建失败: ' + error.message);
            }
        }

        async function startABExperiment(experimentId) {
            try {
                const response = await fetch(`${API_BASE}/api/ab/experiments/${experimentId}/start`, { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                loadABExperiments();
            } catch (error) {
                alert('启动失败: ' + error.message);
            }
        }

        async function pauseABExperiment(experimentId) {
            try {
                const response = await fetch(`${API_BASE}/api/ab/experiments/${experimentId}/pause`, { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                loadABExperiments();
            } catch (error) {
                alert('暂停失败: ' + error.message);
            }
        }

        async function endABExperiment(experimentId) {
            if (!confirm('确定要结束此实验吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/ab/experiments/${experimentId}/end`, { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                loadABExperiments();
            } catch (error) {
                alert('结束失败: ' + error.message);
            }
        }

        async function deployABWinner(experimentId) {
            if (!confirm('确定要部署获胜版本吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/ab/experiments/${experimentId}/deploy-winner`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    alert(`部署成功！版本: ${data.version}`);
                    loadABExperiments();
                    loadModelVersions();
                } else {
                    alert('部署失败: ' + (data.detail || '未知错误'));
                }
            } catch (error) {
                alert('部署失败: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
