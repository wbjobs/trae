[package]
name = "screen-ocr-assistant"
version = "0.1.0"
description = "A Tauri App for screen OCR with automation"
authors = ["you"]
edition = "2021"

[lib]
name = "screen_ocr_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

image = "0.24"
regex = "1.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
thiserror = "1"
anyhow = "1"
base64 = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.51", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemServices",
  "Win32_UI_HighDpi",
  "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "windows")'.dependencies.leptess]
version = "0.16"
default-features = false
features = ["static"]

[target.'cfg(not(target_os = "windows"))'.dependencies.leptess]
version = "0.16"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
