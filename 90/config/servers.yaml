servers:
  - name: server1
    host: 192.168.1.101
    port: 22
    username: root
    password: your_password
    os_type: centos
    groups: [web, production]

  - name: server2
    host: 192.168.1.102
    port: 22
    username: root
    key_file: /path/to/key.pem
    os_type: ubuntu
    groups: [db, production]

  - name: server3
    host: 192.168.1.103
    port: 22
    username: admin
    password: your_password
    os_type: darwin
    groups: [dev, mac]
