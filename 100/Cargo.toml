[package]
name = "dep-tree"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to analyze shared library dependencies of ELF/PE files"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
goblin = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
