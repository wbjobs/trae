apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databasebackups.backup.example.com
spec:
  group: backup.example.com
  names:
    kind: DatabaseBackup
    listKind: DatabaseBackupList
    plural: databasebackups
    singular: databasebackup
    shortNames:
      - dbb
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - mysqlHost
                - mysqlUser
                - mysqlPassword
                - mysqlDatabase
                - s3Bucket
                - s3Endpoint
                - s3AccessKey
                - s3SecretKey
              properties:
                mysqlHost:
                  type: string
                  description: MySQL 主机地址
                mysqlPort:
                  type: integer
                  default: 3306
                  description: MySQL 端口
                mysqlUser:
                  type: string
                  description: MySQL 用户名
                mysqlPassword:
                  type: string
                  description: MySQL 密码
                mysqlDatabase:
                  type: string
                  description: 要备份的数据库名
                schedule:
                  type: string
                  description: Cron 调度表达式
                retentionDays:
                  type: integer
                  default: 7
                  description: 备份保留天数
                s3Bucket:
                  type: string
                  description: S3 存储桶名称
                s3Endpoint:
                  type: string
                  description: S3 端点地址
                s3AccessKey:
                  type: string
                  description: S3 访问密钥
                s3SecretKey:
                  type: string
                  description: S3 密钥
                s3UseSSL:
                  type: boolean
                  default: false
                  description: 是否使用 SSL
            status:
              type: object
              properties:
                lastBackupTime:
                  type: string
                  format: date-time
                nextBackupTime:
                  type: string
                  format: date-time
                currentStatus:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                retryCount:
                  type: integer
                  description: 连续失败重试次数
                lastError:
                  type: string
                  description: 上次错误信息
                lastPreCheck:
                  type: object
                  description: 上次预校验报告
                  properties:
                    passed:
                      type: boolean
                    checkedAt:
                      type: string
                      format: date-time
                    estimatedDuration:
                      type: string
                    dbSize:
                      type: string
                    results:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          status:
                            type: string
                            enum:
                              - Passed
                              - Warning
                              - Failed
                              - Skipped
                          message:
                            type: string
                          detail:
                            type: string
                          duration:
                            type: string
                backupHistory:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      size:
                        type: integer
                      status:
                        type: string
                      startTime:
                        type: string
                        format: date-time
                      finishTime:
                        type: string
                        format: date-time
                      s3Path:
                        type: string
                      error:
                        type: string
      additionalPrinterColumns:
        - name: 状态
          type: string
          jsonPath: .status.currentStatus
        - name: 预校验
          type: string
          jsonPath: .status.lastPreCheck.passed
        - name: 重试
          type: integer
          jsonPath: .status.retryCount
        - name: 数据库
          type: string
          jsonPath: .spec.mysqlDatabase
        - name: 调度
          type: string
          jsonPath: .spec.schedule
        - name: 上次备份
          type: date
          jsonPath: .status.lastBackupTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
