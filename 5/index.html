<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>程序化地形与实时天气系统</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      canvas {
        display: block;
      }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 300px;
      }
      #ui h2 {
        margin-bottom: 15px;
        font-size: 18px;
      }
      .control-group {
        margin-bottom: 15px;
      }
      .control-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }
      .control-group input[type="range"] {
        width: 100%;
      }
      .control-group select,
      .control-group button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 4px;
        background: #3498db;
        color: white;
        cursor: pointer;
        margin-top: 5px;
      }
      .control-group select:hover,
      .control-group button:hover {
        background: #2980b9;
      }
      .control-group button#pause-btn {
        background: #e74c3c;
      }
      .control-group button#pause-btn:hover {
        background: #c0392b;
      }
      .time-display {
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 5px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .time-display span {
        color: #f1c40f;
      }
      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.2);
        margin: 15px 0;
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 10px;
        font-size: 14px;
      }
      #instructions h3 {
        margin-bottom: 10px;
      }
      #instructions p {
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <h2>地形与天气控制</h2>
      
      <div class="time-display">
        时间: <span id="clock-display">12:00</span>
      </div>

      <div class="control-group">
        <label>时间 (小时): <span id="time-value">12</span></label>
        <input type="range" id="time-slider" min="0" max="24" step="0.1" value="12" />
      </div>

      <div class="control-group">
        <label>时间速度 (小时/秒): <span id="time-speed-value">0</span></label>
        <input type="range" id="time-speed-slider" min="0" max="10" step="0.1" value="0" />
      </div>

      <div class="control-group">
        <button id="pause-btn">暂停</button>
      </div>

      <div class="divider"></div>

      <div class="control-group">
        <label>天气系统</label>
        <select id="weather-select">
          <option value="sunny">晴天</option>
          <option value="cloudy">阴天</option>
          <option value="rainy">雨天</option>
          <option value="snowy">雪天</option>
        </select>
      </div>

      <div class="divider"></div>

      <div class="control-group">
        <label>地形高度: <span id="height-value">30</span></label>
        <input type="range" id="height-slider" min="10" max="100" value="30" />
      </div>

      <div class="control-group">
        <label>地形粗糙度: <span id="roughness-value">4</span></label>
        <input type="range" id="roughness-slider" min="1" max="10" step="0.1" value="4" />
      </div>

      <div class="control-group">
        <label>雾浓度: <span id="fog-value">0.02</span></label>
        <input type="range" id="fog-slider" min="0" max="0.1" step="0.001" value="0.02" />
      </div>

      <div class="control-group">
        <button id="regenerate-btn">重新生成地形</button>
      </div>
    </div>

    <div id="instructions">
      <h3>操作说明</h3>
      <p>W/A/S/D - 移动</p>
      <p>鼠标 - 视角控制</p>
      <p>空格 - 跳跃</p>
      <p>Shift - 加速</p>
      <p>点击画面锁定鼠标</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
