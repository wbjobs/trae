druid.service=druid/router
druid.plaintextPort=8888
druid.zk.service.host=zookeeper:2181
druid.zk.paths.base=/druid

druid.metadata.storage.type=derby
druid.metadata.storage.connector.connectURI=jdbc:derby://localhost:1527/druid;create=true

druid.processing.buffer.sizeBytes=100000000
druid.processing.numThreads=2
druid.processing.numMergeBuffers=2
druid.server.http.numThreads=20

druid.monitoring.monitors=["org.apache.druid.java.util.metrics.JvmMonitor"]
druid.emitter=logging
druid.emitter.logging.logLevel=info

druid.coordinator.segment.allowLoaderMove=true
druid.coordinator.load.timeout=PT30M
druid.coordinator.startDelay=PT30S
druid.coordinator.period=PT30S

druid.coordinator.compaction.enabled=true
druid.coordinator.kill.on=true
druid.coordinator.kill.period=P1D
druid.coordinator.kill.durationToRetain=P7D

druid.segmentCache.locations=[{"path":"var/druid/segment-cache","maxSize":500000000000}]

druid.historical.cache.useCache=true
druid.historical.cache.populateCache=true

druid.broker.cache.useCache=true
druid.broker.cache.populateCache=true
druid.broker.cache.unCacheable=["/druid/v2/"]

druid.processing.tmpDir=var/druid/tmp

druid.serverview.type=segment
druid.manager.segments.pollDuration=PT60S

druid.emitter.composing.emitters=[]
