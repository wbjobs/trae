<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 3D Point Cloud Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 40, 0.9);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            min-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        #ui-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00d4ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        select, input[type="file"], button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        select:hover, button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        button.primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            font-weight: bold;
        }
        
        button.primary:hover {
            background: linear-gradient(135deg, #00e6ff, #00aadd);
        }
        
        #stats {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            font-size: 12px;
        }
        
        #stats p {
            margin: 5px 0;
            color: #ccc;
        }
        
        #stats span {
            color: #00d4ff;
            font-weight: bold;
        }
        
        #info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 30, 40, 0.9);
            border-radius: 12px;
            padding: 15px 20px;
            color: #fff;
            backdrop-filter: blur(10px);
        }
        
        #legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 40, 0.9);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            min-width: 200px;
            backdrop-filter: blur(10px);
        }
        
        #legend h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        
        .gradient-bar {
            height: 20px;
            border-radius: 4px;
            margin: 5px 0;
            background: linear-gradient(to right, 
                #313695, #4575b4, #74add1, #abd9e9, 
                #e0f3f8, #ffffbf, #fee090, #fdae61, 
                #f46d43, #d73027, #a50026
            );
        }
        
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #aaa;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <div id="ui-panel">
            <h2>Point Cloud Viewer</h2>
            
            <div class="control-group">
                <label>上传点云文件</label>
                <input type="file" id="file-input" accept=".las,.laz,.ply">
            </div>
            
            <div class="control-group" id="file-list-group">
                <label>选择文件</label>
                <select id="file-select">
                    <option value="">-- 请选择文件 --</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>聚类算法</label>
                <select id="cluster-algorithm">
                    <option value="kmeans">K-Means</option>
                    <option value="dbscan">DBSCAN (GPU初筛)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>聚类数量 (K-Means)</label>
                <div class="slider-container">
                    <input type="range" id="k-value" min="2" max="20" value="5">
                    <span id="k-value-display">5</span>
                </div>
            </div>
            
            <div class="control-group">
                <label>颜色映射方案</label>
                <select id="color-scheme">
                    <option value="heatmap">热度图</option>
                    <option value="height">高度渐变</option>
                    <option value="cluster">聚类颜色</option>
                    <option value="original">原始颜色</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>点大小</label>
                <div class="slider-container">
                    <input type="range" id="point-size" min="0.5" max="5" step="0.1" value="1.5">
                    <span id="point-size-display">1.5</span>
                </div>
            </div>
            
            <div class="control-group">
                <button class="primary" id="load-btn">加载点云</button>
            </div>
            
            <div class="control-group">
                <button id="cluster-btn">运行聚类</button>
            </div>
            
            <div id="stats" class="hidden">
                <p>总点数: <span id="stat-points">-</span></p>
                <p>聚类数: <span id="stat-clusters">-</span></p>
                <p>LOD层级: <span id="stat-lod">-</span></p>
                <p>FPS: <span id="stat-fps">-</span></p>
            </div>
        </div>
        
        <div id="info-panel">
            <p>操作: 鼠标左键旋转 | 右键平移 | 滚轮缩放</p>
            <p>悬停在聚类上查看高亮效果</p>
        </div>
        
        <div id="legend" class="hidden">
            <h3 id="legend-title">值分布</h3>
            <div class="gradient-bar"></div>
            <div class="legend-labels">
                <span id="legend-min">低</span>
                <span id="legend-max">高</span>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
