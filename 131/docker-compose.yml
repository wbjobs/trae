version: '3.8'

services:
  etcd:
    image: bitnami/etcd:3.5
    container_name: etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/bitnami/etcd
    networks:
      - gray-routing-network

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    networks:
      - gray-routing-network

  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_MESSAGE_MAX_BYTES=10485760
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    depends_on:
      - zookeeper
    networks:
      - gray-routing-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=gray-routing
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - gray-routing-network

  apisix:
    image: apache/apisix:3.8.0-debian
    container_name: apisix
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./apisix/plugins:/usr/local/apisix/apisix/plugins
      - ./apisix/wasm:/usr/local/apisix/apisix/wasm
    ports:
      - "9080:9080"
      - "9180:9180"
      - "9091:9091"
    depends_on:
      - etcd
    networks:
      - gray-routing-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gray-routing-backend
    environment:
      - NODE_ENV=production
      - SERVER_PORT=3001
      - ETCD_ENDPOINTS=http://etcd:2379
      - CORS_ORIGIN=*
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=gray-routing-requests
      - KAFKA_ENABLED=true
      - SAMPLING_RATE=0.01
    ports:
      - "3001:3001"
    depends_on:
      - etcd
      - kafka
    networks:
      - gray-routing-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gray-routing-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - gray-routing-network
    restart: unless-stopped

  backend-v1:
    image: nginx:alpine
    container_name: backend-v1
    volumes:
      - ./docker/backend-v1/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/backend-v1/index.html:/usr/share/nginx/html/index.html
    ports:
      - "8081:80"
    networks:
      - gray-routing-network

  backend-v2:
    image: nginx:alpine
    container_name: backend-v2
    volumes:
      - ./docker/backend-v2/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/backend-v2/index.html:/usr/share/nginx/html/index.html
    ports:
      - "8082:80"
    networks:
      - gray-routing-network

  backend-canary:
    image: nginx:alpine
    container_name: backend-canary
    volumes:
      - ./docker/backend-canary/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/backend-canary/index.html:/usr/share/nginx/html/index.html
    ports:
      - "8083:80"
    networks:
      - gray-routing-network

volumes:
  etcd-data:
  zookeeper-data:
  kafka-data:

networks:
  gray-routing-network:
    driver: bridge
