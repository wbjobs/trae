worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/json;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /health {
            return 200 '{"status":"ok","version":"v1"}';
        }

        location /api {
            add_header Content-Type application/json;
            return 200 '{"version":"v1","message":"This is backend V1 stable version","timestamp":"$time_iso8601"}';
        }
    }
}
