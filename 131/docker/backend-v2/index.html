<!DOCTYPE html>
<html>
<head>
    <title>Backend V2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .container {
            text-align: center;
            color: white;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .version {
            font-size: 24px;
            background: rgba(255,255,255,0.2);
            padding: 10px 30px;
            border-radius: 50px;
            display: inline-block;
        }
        .badge {
            background: #ffc107;
            color: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Backend Service</h1>
        <div class="version">Version: V2 (New)</div>
        <div class="badge">NEW FEATURES</div>
    </div>
</body>
</html>
