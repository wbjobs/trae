[package]
name = "gray-routing-wasm"
version = "1.0.0"
edition = "2021"
description = "APISIX Gray Routing Wasm Plugin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
proxy-wasm = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
