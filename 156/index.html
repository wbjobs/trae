<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统监控仪表盘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    #main {
      padding: 20px;
    }
    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #333366;
    }
    .header h1 {
      font-size: 28px;
      color: #00d4ff;
    }
    .header .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #888;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #4caf50;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
    }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    .card h2 {
      font-size: 18px;
      color: #00d4ff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a4a;
    }
    .metric:last-child {
      border-bottom: none;
    }
    .metric-label {
      color: #888;
      font-size: 14px;
    }
    .metric-value {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #2a2a4a;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #00d4ff);
      transition: width 0.3s ease;
    }
    .progress-fill.warning {
      background: linear-gradient(90deg, #ff9800, #f44336);
    }
    .cpu-cores {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }
    .cpu-core {
      background: #1a1a3e;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .cpu-core-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .cpu-core-value {
      font-size: 20px;
      font-weight: bold;
      color: #00d4ff;
    }
    .cpu-core-bar {
      height: 6px;
      background: #2a2a4a;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .cpu-core-fill {
      height: 100%;
      transition: width 0.3s ease;
    }
    .chart-container {
      width: 100%;
      height: 200px;
      background: #0f0f1e;
      border-radius: 8px;
      margin-top: 12px;
    }
    .alert-banner {
      background: linear-gradient(90deg, #f44336, #ff9800);
      color: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .alert-banner button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .alert-banner button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .network-stats {
      display: flex;
      gap: 24px;
    }
    .network-item {
      flex: 1;
    }
    .network-direction {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
    }
    .network-value {
      font-size: 24px;
      font-weight: bold;
      color: #00d4ff;
    }
    .disk-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .disk-item {
      background: #1a1a3e;
      border-radius: 8px;
      padding: 12px;
    }
    .disk-name {
      font-size: 13px;
      color: #888;
    }
    .disk-usage {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 14px;
    }
    .disk-bar {
      height: 6px;
      background: #2a2a4a;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .disk-fill {
      height: 100%;
      transition: width 0.3s ease;
    }
    .threshold-config {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #2a2a4a;
    }
    .threshold-config label {
      font-size: 14px;
      color: #888;
    }
    .threshold-config input {
      width: 80px;
      padding: 8px;
      background: #1a1a3e;
      border: 1px solid #333366;
      border-radius: 4px;
      color: #fff;
      text-align: center;
    }
    .search-section {
      margin-bottom: 20px;
    }
    .search-container {
      display: flex;
      gap: 12px;
      background: #16213e;
      padding: 16px;
      border-radius: 12px;
    }
    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: #1a1a3e;
      border: 1px solid #333366;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    .search-input:focus {
      outline: none;
      border-color: #00d4ff;
    }
    .search-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
    }
    .search-results {
      margin-top: 16px;
      max-height: 400px;
      overflow-y: auto;
    }
    .search-result-item {
      background: #1a1a3e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #00d4ff;
    }
    .search-result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .search-result-type {
      padding: 4px 12px;
      background: #333366;
      border-radius: 4px;
      font-size: 12px;
      color: #00d4ff;
      text-transform: uppercase;
    }
    .search-result-time {
      font-size: 12px;
      color: #888;
    }
    .search-result-content {
      color: #e0e0e0;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .search-result-score {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #888;
    }
    .search-result-score span {
      background: #2a2a4a;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .no-results {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    .events-tab {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 8px 16px;
      background: #1a1a3e;
      border: 1px solid #333366;
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      font-size: 14px;
    }
    .tab-btn.active {
      background: #00d4ff;
      color: #1a1a2e;
      border-color: #00d4ff;
    }
  </style>
</head>
<body>
  <div id="main"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
