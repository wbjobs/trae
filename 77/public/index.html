<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时交易异常检测仪表板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-dot.disconnected {
            background: #ff4757;
            box-shadow: 0 0 10px #ff4757;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .stat-card .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .value.rate {
            font-size: 32px;
        }

        .stat-card .unit {
            font-size: 14px;
            color: #888;
            margin-left: 4px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #00d4ff, #7b2cbf);
            border-radius: 2px;
        }

        #mainChart {
            height: 400px;
        }

        #rateChart {
            height: 400px;
        }

        .alerts-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .alerts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .alerts-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .alerts-list::-webkit-scrollbar {
            width: 6px;
        }

        .alerts-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .alerts-list::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 3px;
        }

        .alert-item {
            background: rgba(255, 71, 87, 0.1);
            border-left: 4px solid #ff4757;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
        }

        .alert-item.high {
            background: rgba(255, 71, 87, 0.15);
            border-left-color: #ff4757;
        }

        .alert-item.medium {
            background: rgba(255, 165, 0, 0.15);
            border-left-color: #ffa502;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-item:hover {
            background: rgba(255, 71, 87, 0.2);
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alert-severity {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .alert-severity.HIGH {
            background: #ff4757;
            color: white;
        }

        .alert-severity.MEDIUM {
            background: #ffa502;
            color: white;
        }

        .alert-time {
            font-size: 11px;
            color: #888;
        }

        .alert-details {
            font-size: 13px;
            color: #ccc;
        }

        .alert-detail-row {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }

        .alert-detail-label {
            color: #888;
        }

        .alert-detail-value {
            font-family: 'Courier New', monospace;
        }

        .no-alerts {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 14px;
        }

        .anomaly-badge {
            display: inline-block;
            background: #ff4757;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 5px;
        }

        .reconnect-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: transform 0.2s;
        }

        .reconnect-btn:hover {
            transform: scale(1.05);
        }

        .reconnect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .root-cause-summary {
            background: rgba(123, 44, 191, 0.1);
            border-left: 4px solid #7b2cbf;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #e0e0e0;
        }

        .root-cause-summary.has-result {
            background: rgba(123, 44, 191, 0.15);
        }

        .root-cause-summary-text {
            font-size: 15px;
            line-height: 1.6;
        }

        .root-cause-summary-text strong {
            color: #00d4ff;
        }

        .root-cause-meta {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }

        .root-cause-rules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .rule-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(123, 44, 191, 0.3);
            transition: all 0.3s;
        }

        .rule-card:hover {
            border-color: #7b2cbf;
            box-shadow: 0 5px 20px rgba(123, 44, 191, 0.2);
            transform: translateY(-2px);
        }

        .rule-pattern {
            font-size: 13px;
            color: #e0e0e0;
            margin-bottom: 12px;
            line-height: 1.5;
            font-family: 'Courier New', monospace;
        }

        .rule-pattern .antecedent {
            color: #00d4ff;
        }

        .rule-pattern .arrow {
            color: #7b2cbf;
            margin: 0 8px;
        }

        .rule-pattern .consequent {
            color: #ff4757;
        }

        .rule-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .metric {
            text-align: center;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .metric-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 16px;
            font-weight: bold;
            color: #00d4ff;
        }

        .metric-value.support {
            color: #7b2cbf;
        }

        .metric-value.risk {
            color: #ff4757;
        }

        .rule-rank {
            display: inline-block;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .no-rules {
            grid-column: 1 / -1;
            text-align: center;
            color: #666;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 实时交易异常检测仪表板</h1>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot disconnected" id="connectionStatus"></span>
                    <span id="connectionText">未连接</span>
                </div>
                <button class="reconnect-btn" id="reconnectBtn" onclick="connectWebSocket()">重新连接</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">交易速率</div>
                <div class="value rate"><span id="transactionRate">0</span><span class="unit"> tx/s</span></div>
            </div>
            <div class="stat-card">
                <div class="label">总交易数</div>
                <div class="value"><span id="totalTransactions">0</span></div>
            </div>
            <div class="stat-card">
                <div class="label">异常告警数</div>
                <div class="value"><span id="totalAlerts">0</span></div>
            </div>
            <div class="stat-card">
                <div class="label">平均交易金额</div>
                <div class="value">¥<span id="avgAmount">0.00</span></div>
            </div>
            <div class="stat-card">
                <div class="label">当前窗口均值</div>
                <div class="value">¥<span id="currentMean">0.00</span></div>
            </div>
            <div class="stat-card">
                <div class="label">3σ 上下界</div>
                <div class="value" style="font-size: 18px;">
                    <span style="color: #00ff88;">¥<span id="lowerBound">0.00</span></span>
                    ~
                    <span style="color: #ff4757;">¥<span id="upperBound">0.00</span></span>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">交易金额趋势（异常点高亮）</div>
                <div id="mainChart"></div>
            </div>
            <div class="chart-container">
                <div class="chart-title">交易速率 (TPS)</div>
                <div id="rateChart"></div>
            </div>
        </div>

        <div class="alerts-section">
            <div class="alerts-header">
                <div class="chart-title">异常告警列表</div>
                <span style="color: #888; font-size: 12px;">最近 <span id="alertCount">0</span> 条告警</span>
            </div>
            <div class="alerts-list" id="alertsList">
                <div class="no-alerts">暂无异常告警</div>
            </div>
        </div>

        <div class="alerts-section" style="margin-top: 20px;">
            <div class="alerts-header">
                <div class="chart-title">🔍 异常根因分析</div>
                <span style="color: #888; font-size: 12px;">基于FP-Growth关联规则挖掘</span>
            </div>
            <div id="rootCauseSummary" class="root-cause-summary">
                <div class="no-alerts">等待检测到异常后自动进行根因分析...</div>
            </div>
            <div class="root-cause-rules" id="rootCauseRules">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
