<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pixel Board</title>
    <style>
        html, body { margin: 0; padding: 0; background: #1a1a1a; color: #eee; font-family: system-ui, sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 16px; margin: 8px; }
        #container { position: relative; }
        canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
        footer { font-size: 12px; opacity: 0.7; padding: 8px; }
    </style>
</head>
<body>
    <h1>Pixel Board</h1>
    <div id="container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <footer>Left-click: draw | Right-click: pick color</footer>
    {{{ SCRIPT }}}
</body>
</html>
