<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPH 流体模拟</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #fff;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 5px;
      pointer-events: none;
      z-index: 100;
    }
    #ui .row {
      margin: 2px 0;
    }
    #ui .label {
      color: #7fff7f;
      margin-right: 8px;
    }
    #ui .value {
      color: #ffffff;
    }
    #controls {
      position: fixed;
      top: 10px;
      right: 10px;
      color: #fff;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 5px;
      z-index: 100;
      line-height: 1.8;
    }
    #controls .title {
      color: #7fff7f;
      font-weight: bold;
      margin-bottom: 5px;
    }
    #controls .key {
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div class="row"><span class="label">FPS:</span><span class="value" id="fps">--</span></div>
    <div class="row"><span class="label">Particles:</span><span class="value" id="count">--</span></div>
    <div class="row"><span class="label">Mode:</span><span class="value" id="mode">--</span></div>
  </div>
  <div id="controls">
    <div class="title">Controls</div>
    <div><span class="key">左键拖拽</span> 添加粒子源</div>
    <div><span class="key">右键拖拽</span> 旋转视角</div>
    <div><span class="key">滚轮</span> 缩放视角</div>
    <div><span class="key">空格</span> 重置模拟</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
