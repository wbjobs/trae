server:
  port: 8083

spring:
  application:
    name: sampling-service
  main:
    allow-bean-definition-overriding: true
  shardingsphere:
    datasource:
      names: ds0,ds1
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/power_sampling_0?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: root
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/power_sampling_1?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
        username: root
        password: root
    sharding:
      default-database-strategy:
        inline:
          sharding-column: device_id
          algorithm-expression: ds$->{device_id % 2}
      tables:
        t_power_sampling:
          actual-data-nodes: ds$->{0..1}.t_power_sampling_$->{0..3}
          table-strategy:
            inline:
              sharding-column: device_id
              algorithm-expression: t_power_sampling_$->{device_id % 4}
          key-generator:
            column: id
            type: SNOWFLAKE
            worker:
              id: 1
      binding-tables: t_power_sampling
    props:
      sql:
        show: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.power.sampling.common.entity
  configuration:
    map-underscore-to-camel-case: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
    metadata-map:
      data-center: dc1
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    health-check-url-path: /actuator/health
  client:
    service-url:
      defaultZone: http://eureka:eureka2024@localhost:8761/eureka/,http://eureka:eureka2024@localhost:8762/eureka/
    registry-fetch-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 10
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 5

feign:
  sentinel:
    enabled: true
  hystrix:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 10000
      circuitBreaker:
        enabled: true
        requestVolumeThreshold: 50
        errorThresholdPercentage: 50
        sleepWindowInMilliseconds: 5000

logging:
  level:
    com.power.sampling: debug
    com.alibaba.csp.sentinel: info
    org.apache.shardingsphere: info
