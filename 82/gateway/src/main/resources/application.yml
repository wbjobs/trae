server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: device-service
          uri: lb://device-service
          predicates:
            - Path=/device/**

        - id: sampling-service
          uri: lb://sampling-service
          predicates:
            - Path=/sampling/**

        - id: calculation-service
          uri: lb://calculation-service
          predicates:
            - Path=/calculation/**

        - id: scheduler-service
          uri: lb://scheduler-service
          predicates:
            - Path=/scheduler/**

    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8719
      eager: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
    metadata-map:
      data-center: dc1
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    health-check-url-path: /actuator/health
  client:
    service-url:
      defaultZone: http://eureka:eureka2024@localhost:8761/eureka/,http://eureka:eureka2024@localhost:8762/eureka/
    registry-fetch-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 10
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 5

gray:
  release:
    enabled: true
    services:
      - service-name: sampling-service
        enabled: false
        gray-type: 1
        weight-percent: 10
        gray-users:
          - admin
          - test
        gray-ips:
          - 192.168.1.100
        target-version: v2.0.0
      - service-name: calculation-service
        enabled: false
        gray-type: 1
        weight-percent: 20
        target-version: v2.0.0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: debug
    com.alibaba.csp.sentinel: info
