server:
  port: 8082

spring:
  application:
    name: device-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/power_device?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.power.sampling.common.entity
  configuration:
    map-underscore-to-camel-case: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
    metadata-map:
      data-center: dc1
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    health-check-url-path: /actuator/health
  client:
    service-url:
      defaultZone: http://eureka:eureka2024@localhost:8761/eureka/,http://eureka:eureka2024@localhost:8762/eureka/
    registry-fetch-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 10
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 5

feign:
  sentinel:
    enabled: true
  hystrix:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 5000
      circuitBreaker:
        enabled: true
        requestVolumeThreshold: 20
        errorThresholdPercentage: 50
        sleepWindowInMilliseconds: 5000

logging:
  level:
    com.power.sampling: debug
    com.alibaba.csp.sentinel: info
