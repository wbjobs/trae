[package]
name = "otel-sampling-proxy"
version = "0.1.0"
edition = "2021"
description = "OpenTelemetry Sampling Proxy with etcd-backed dynamic sampling"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
etcd-client = { version = "0.14", features = ["tls"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
futures = "0.3"
async-trait = "0.1"
dashmap = "6"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
